# Builds OpenCiv2.exe on every push to main (kept as the run's artifact) and,
# for a v* tag, publishes it as that release: OpenCiv2-windows.zip with the one
# executable, which sets the game up from the user's copy.
name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (wasi-sdk, wabt, MinGW, SDL2 for MinGW)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 cmake ninja-build
          sh tools/fetch-toolchain.sh windows

      - name: Set-up libraries (libarchive, libunshield ...)
        env:
          CC: x86_64-w64-mingw32-gcc-posix
        run: python3 tools/build_deps.py

      - name: Build
        env:
          CC: x86_64-w64-mingw32-gcc-posix
        run: python3 tools/build_port.py module c exe-windows

      - name: Package
        run: python3 tools/release/package.py "${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCiv2-windows
          path: dist/OpenCiv2-windows.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="OpenCiv2 ${tag}: unpack anywhere, run OpenCiv2.exe and show it your copy of Civilization II Multiplayer Gold Edition (see README.txt). Built from ${GITHUB_SHA::7} on Richard Penman's reconstruction, https://github.com/richardpenman/civ2. Icon: \"Icon Civilization II\" by alexielios, https://www.deviantart.com/alexielios/art/Icon-Civilization-II-558913212"
          # a release published by hand for this tag is left as it is
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; not replacing its files"
          else
            gh release create "$tag" dist/OpenCiv2-windows.zip --title "OpenCiv2 ${tag}" --notes "$notes" --latest
          fi
